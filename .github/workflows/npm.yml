on:
  # Only `main` publishes - a push to a feature branch used to start this job and
  # then fail on `git push origin main`.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparing git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Installing
        run: yarn install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Testing
        run: yarn test

      - name: Publishing
        run: |
          yarn build
          yarn release
          git push --follow-tags origin main
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Saving yarn.lock
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "yarn.lock wasn't changed"
          else
            # commiting the file
            git add yarn.lock
            git commit -m "chore(yarn.lock): updated [ci skip]"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
          fi
